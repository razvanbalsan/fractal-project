# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Fractal IT"
email: office@fractal.ro
tagline: "Service Laptop Cluj-Napoca"
description: >-
  Service laptop Cluj-Napoca: reparații hardware, reballing BGA, recuperare date și consultanță IT. Fractal IT - experți în tehnologie.
baseurl: ""
url: "https://fractal.ro"
phone: "0747-99.66.77"
address: "Ilie Măcelaru 26, Cluj-Napoca"

# Build settings (Minimal Mistakes theme)
theme: minimal-mistakes-jekyll
minimal_mistakes_skin    : "air" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
logo: /assets/images/sigla_226.png
name: "Fractal IT"
locale: ro
# Pagination dezactivată momentan (nu există pagină blog dedicată). Re-activați prin adăugarea cheilor
# paginate: 5
# paginate_path: "blog/page:num"
permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-paginate
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
# plugins:
  # - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      show_meta: false
      comments: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      show_meta: true
      comments: false

# Reading Files
include:
  # - .htaccess
  - _pages
  - _posts
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - "*.bak"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - assets/css/main.css
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Social sharing (exclude broken platforms)
social:
  type: Organization
  name: "Fractal IT SRL"
  links:
    - "https://fractal.ro"

# Social sharing configuration
social_share:
  - facebook
  - email

# Set or override footer content:
author: fractal

