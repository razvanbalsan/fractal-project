<style>
/* Critical above-the-fold CSS - Modern Design System */
:root{--color-primary:#2563eb;--color-primary-dark:#1d4ed8;--color-text:#1e293b;--color-border:#e2e8f0;--shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);--shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.1)}
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.masthead{position:sticky;top:0;border-bottom:1px solid var(--color-border);background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;box-shadow:var(--shadow-sm)}
.site-title{display:flex;align-self:center;font-weight:700;text-decoration:none;letter-spacing:-0.01em}
.site-logo img{max-height:2rem;width:80px;height:32px;object-fit:contain}
.greedy-nav a{color:var(--color-text);font-weight:500;padding:.75rem 1rem;border-radius:6px;transition:all 150ms}
.greedy-nav a:hover{color:var(--color-primary);background:#eff6ff}
.page__hero--overlay{position:relative;margin-bottom:2em;padding:4rem 0;background-size:cover;background-repeat:no-repeat;background-position:center}
.page__hero--overlay::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(30,41,59,.85) 0%,rgba(37,99,235,.7) 100%);z-index:1}
.page__hero--overlay .wrapper{position:relative;z-index:2}
.page__hero--overlay .page__title{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.btn{display:inline-block;margin-bottom:.25em;padding:.75rem 1.5rem;font-weight:600;text-align:center;text-decoration:none;border:0;border-radius:10px;cursor:pointer;transition:all 200ms;position:relative;overflow:hidden}
.btn--primary{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#fff;box-shadow:var(--shadow-md)}
.btn--primary:hover{box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.1),0 0 20px rgba(37,99,235,.4);transform:translateY(-2px)}
.btn--large{padding:1rem 2rem;font-size:1rem}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.page__content{animation:fadeInUp .4s ease-out}
</style>
