<!-- Custom social sharing without problematic platforms -->
<section class="page__share">
  <h4 class="page__share-title">Distribuie articolul</h4>
  
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" 
     class="btn btn--facebook" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" 
     title="Distribuie pe Facebook">
    <i class="fab fa-fw fa-facebook" aria-hidden="true"></i><span> Facebook</span>
  </a>

  <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}" 
     class="btn btn--twitter" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" 
     title="Distribuie pe Twitter">
    <i class="fab fa-fw fa-twitter" aria-hidden="true"></i><span> Twitter</span>
  </a>

  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" 
     class="btn btn--linkedin" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" 
     title="Distribuie pe LinkedIn">
    <i class="fab fa-fw fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span>
  </a>

  <a href="https://web.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" 
     class="btn btn--success" 
     title="Distribuie pe WhatsApp">
    <i class="fab fa-fw fa-whatsapp" aria-hidden="true"></i><span> WhatsApp</span>
  </a>

  <a href="mailto:?subject={{ page.title | url_encode }}&body={{ page.url | absolute_url | url_encode }}" 
     class="btn btn--email" 
     title="Trimite prin email">
    <i class="fas fa-fw fa-envelope" aria-hidden="true"></i><span> Email</span>
  </a>
</section>
